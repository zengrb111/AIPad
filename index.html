<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f3ec" />

    <!-- 装到桌面 / 主屏幕：安卓走 manifest，iPad 走 apple-* 这几项 -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="相框" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <title>相框</title>

    <style>
      /* 启动兜底：JS 没跑起来时屏幕上也有东西，不会再是一片白 */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #16120f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font: 15px/1.7 -apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        letter-spacing: 0.04em;
      }
      #boot .b-title {
        color: rgba(240, 228, 214, 0.62);
      }
      #boot .b-ver {
        font-size: 11px;
        color: rgba(240, 228, 214, 0.26);
        letter-spacing: 0.1em;
      }
      #boot-err {
        display: none;
        max-width: 82vw;
        margin-top: 18px;
        padding: 12px 16px;
        border-radius: 10px;
        background: rgba(150, 40, 30, 0.28);
        border: 1px solid rgba(220, 90, 70, 0.45);
        color: #ffd7cf;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot">
      <div class="b-title">正在启动…</div>
      <div class="b-ver">v1.5</div>
      <div id="boot-err"></div>
    </div>

    <script>
      // 出错时把原因显示出来，别再让人对着一片白猜
      ;(function () {
        var box = document.getElementById('boot-err')
        var shown = false
        function show(msg) {
          if (!box || shown) return
          shown = true
          box.style.display = 'block'
          box.textContent = '启动出错：' + msg
        }
        window.addEventListener('error', function (e) {
          if (e.target && e.target !== window) return
          show((e.message || 'unknown') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''))
        })
        window.addEventListener('unhandledrejection', function (e) {
          show((e.reason && (e.reason.message || e.reason)) || 'promise rejected')
        })
        // 8 秒还没挂载，说明卡住了，把状态亮出来
        setTimeout(function () {
          if (!document.getElementById('boot')) return
          var t = document.querySelector('#boot .b-title')
          if (t) t.textContent = '启动超时，正在等页面响应…'
        }, 8000)
      })()
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
